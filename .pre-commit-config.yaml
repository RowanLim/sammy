# 提交前自动跑：格式化 + 检查 + 离线单测（不联网，所以提交不会被网络卡住）
fail_fast: false

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-offline
        name: pytest（离线用例）
        entry: .venv/bin/python -m pytest -m "not live"
        language: system
        pass_filenames: false
        always_run: true

      # 推送前跑全历史审计 —— 比提交前更严格，因为一旦推出去就泄了
      - id: audit-repo
        name: 全历史凭证审计
        entry: .venv/bin/python scripts/audit_repo.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: staged-secrets
        name: 扫暂存区有没有凭证
        entry: .venv/bin/python scripts/check_staged_secrets.py
        language: system
        pass_filenames: false
        always_run: true
